# Rendered by nginx at container start (envsubst on ${PLATFORM_DOMAIN}).
# Terminates TLS with a wildcard certificate and routes every tenant
# subdomain (alshifa.${PLATFORM_DOMAIN}, ...) plus the apex to the app.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:4000; }

# HTTP: serve ACME challenges, redirect everything else to HTTPS.
server {
    listen 80;
    server_name ${PLATFORM_DOMAIN} *.${PLATFORM_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PLATFORM_DOMAIN} *.${PLATFORM_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${PLATFORM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PLATFORM_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 15m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
